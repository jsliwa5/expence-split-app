name: Backend CI Pipeline

# Kiedy ma się uruchamiać? 
# Przy każdym pushu do gałęzi main i przy każdym Pull Request.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest # Darmowy wirtualny serwer z Linuxem na GitHubie

    steps:
      # 1. GitHub pobiera Twój kod na serwer
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Instaluje środowisko Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Przyspiesza CI, bo nie pobiera Springa od nowa za każdym razem

      # 3. Uruchamia Mavena (Kompilacja i Testy)
      - name: Run Maven Build & Tests
        run: mvn clean verify