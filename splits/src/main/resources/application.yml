spring:
  application:
    name: splits

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5433/expension-splits
    username: splits
    password: splits

  flyway:
    enabled: true
    baseline-on-migrate: true




